<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Manga Strike: Sector Wars</title>
    <style>
      :root {
        --bg-1: #09111f;
        --bg-2: #11182c;
        --panel: rgba(14, 22, 39, 0.8);
        --panel-border: rgba(128, 216, 255, 0.7);
        --text: #eaf8ff;
        --muted: #b8d8ea;
        --gold: #f5c76b;
        --danger: #ff637d;
        --success: #8ef2ab;
        --primary: #5bd3ff;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(
          circle at top,
          #1d2a4c 0%,
          var(--bg-1) 38%,
          #040b13 100%
        );
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #gameWrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #020a12;
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: linear-gradient(
          180deg,
          rgba(9, 17, 31, 1),
          rgba(12, 20, 30, 1)
        );
      }

      #menu {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(6, 10, 18, 0.7);
        backdrop-filter: blur(8px);
        z-index: 10;
      }

      .panel {
        width: min(940px, calc(100vw - 28px));
        max-height: 90vh;
        overflow: auto;
        padding: 20px 18px 18px;
        border: 2px solid var(--panel-border);
        border-radius: 22px;
        background: rgba(15, 22, 36, 0.82);
        box-shadow: 0 20px 40px var(--shadow);
      }

      .title {
        font-size: clamp(28px, 5vw, 52px);
        text-align: center;
        margin: 0 0 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #d7f7ff;
        text-shadow: 0 0 18px rgba(91, 211, 255, 0.9);
      }

      .subtitle {
        text-align: center;
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 15px;
      }

      .sectionLabel {
        margin: 18px 0 10px;
        font-size: 14px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--gold);
        opacity: 0.95;
      }

      .cardGrid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }

      .optionCard {
        position: relative;
        border: 2px solid rgba(149, 202, 255, 0.35);
        border-radius: 16px;
        background: rgba(11, 17, 31, 0.9);
        padding: 12px 12px 10px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
        user-select: none;
      }

      .optionCard:hover,
      .optionCard.active {
        transform: translateY(-2px);
        border-color: var(--primary);
        box-shadow: 0 0 18px rgba(91, 211, 255, 0.35);
      }

      .optionCard h3 {
        margin: 0 0 4px;
        font-size: 18px;
      }

      .optionCard p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .statRow {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-top: 8px;
        color: #d9edff;
      }

      .statRow span:last-child {
        color: var(--success);
        font-weight: 700;
      }

      .menuActions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      #startBtn,
      #exitBtn,
      .secondaryBtn {
        border: none;
        border-radius: 999px;
        padding: 14px 28px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }

      #startBtn {
        color: #031018;
        background: linear-gradient(135deg, #7be7ff, #82ffbb);
        box-shadow: 0 12px 28px rgba(123, 231, 255, 0.35);
      }

      #exitBtn,
      .secondaryBtn {
        color: #eaf8ff;
        background: linear-gradient(
          135deg,
          rgba(255, 110, 132, 0.9),
          rgba(123, 119, 255, 0.7)
        );
        box-shadow: 0 12px 28px rgba(149, 119, 255, 0.3);
      }

      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 6;
        display: none;
      }

      .hudTop {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .hudExitBtn {
        position: absolute;
        top: 16px;
        right: 18px;
        z-index: 8;
        pointer-events: auto;
        border: 1px solid rgba(255, 127, 148, 0.75);
        background: rgba(18, 21, 34, 0.82);
        color: #ffeaf0;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
      }

      .skillPanel {
        min-width: 190px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .skillGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(70px, 1fr));
        gap: 8px;
      }

      .skillButton {
        border: 1px solid rgba(123, 231, 255, 0.7);
        background: rgba(19, 32, 50, 0.85);
        color: #ebfaff;
        border-radius: 10px;
        padding: 8px 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        cursor: pointer;
        pointer-events: auto;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease,
          opacity 0.12s ease;
      }

      .skillButton:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 14px rgba(91, 211, 255, 0.25);
      }

      .skillButton:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .hudPanel {
        background: rgba(11, 17, 30, 0.78);
        border: 1px solid rgba(91, 211, 255, 0.5);
        border-radius: 14px;
        padding: 10px 12px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
      }

      .stats {
        min-width: 210px;
      }

      .label {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 1.3px;
        text-transform: uppercase;
        margin-bottom: 5px;
      }

      .healthBar {
        position: relative;
        width: 100%;
        height: 14px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .healthFill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 100%;
        background: linear-gradient(90deg, #ff6a88, #ffb347, #8ef2ab);
        box-shadow: 0 0 14px rgba(142, 242, 171, 0.7);
        transition: width 0.15s linear;
      }

      .infoRow {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        color: var(--text);
        margin-top: 4px;
      }

      .zoneBadge {
        min-width: 200px;
        text-align: center;
        font-weight: 700;
      }

      .zoneName {
        font-size: 15px;
        color: var(--gold);
        text-shadow: 0 0 12px rgba(245, 199, 107, 0.9);
      }

      .notif {
        position: absolute;
        left: 50%;
        top: 84px;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid rgba(123, 231, 255, 0.7);
        background: rgba(17, 28, 42, 0.86);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #dff9ff;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .notif.show {
        opacity: 1;
      }

      .mobileControls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 180px;
        z-index: 7;
        pointer-events: none;
        display: none;
      }

      .joystickArea {
        position: absolute;
        left: 18px;
        bottom: 18px;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        background: rgba(17, 30, 39, 0.3);
        border: 1px solid rgba(123, 231, 255, 0.28);
        pointer-events: auto;
      }

      .stick {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(91, 211, 255, 0.95),
          rgba(91, 211, 255, 0.3)
        );
        transform: translate(-50%, -50%);
        box-shadow: 0 0 20px rgba(91, 211, 255, 0.4);
      }

      .shootBtn {
        position: absolute;
        right: 22px;
        bottom: 28px;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 2px solid rgba(255, 99, 125, 0.7);
        background: radial-gradient(
          circle,
          rgba(255, 99, 125, 0.44),
          rgba(255, 99, 125, 0.18)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 1.2px;
        color: #fff;
        pointer-events: auto;
        box-shadow: 0 0 20px rgba(255, 99, 125, 0.4);
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      @media (max-width: 700px) {
        .mobileControls {
          display: block;
        }
        .hudTop {
          padding-right: 8px;
        }
        .stats {
          min-width: 150px;
        }
        .zoneBadge {
          min-width: 120px;
        }
        .title {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div id="gameWrap">
      <canvas id="gameCanvas"></canvas>

      <div id="menu">
        <div class="panel">
          <h1 class="title">Manga Strike</h1>
          <p class="subtitle">
            Kiber-sinfdan qutulish uchun botlarni yo'q qiling. Turli zonalar,
            qahramonlar va qurollar bilan jang qiling.
          </p>

          <div class="sectionLabel">Qahramon tanlang</div>
          <div id="characterGrid" class="cardGrid"></div>

          <div class="sectionLabel">Qurol tanlang</div>
          <div id="weaponGrid" class="cardGrid"></div>

          <div class="menuActions">
            <button id="startBtn">Jangga kirish</button>
            <button id="exitBtn" type="button">Chiqish</button>
          </div>
        </div>
      </div>

      <div id="hud">
        <button id="hudExitBtn" class="hudExitBtn" type="button">
          Chiqish
        </button>
        <div class="hudTop">
          <div class="hudPanel stats">
            <div class="label">Karyer/Health</div>
            <div class="healthBar">
              <div id="healthFill" class="healthFill"></div>
            </div>
            <div class="infoRow">
              <span id="hpText">100 / 100</span>
              <span id="scoreText">0</span>
            </div>
            <div class="infoRow">
              <span id="waveText">Wave 1</span>
              <span id="ammoText">Ammo ∞</span>
            </div>
          </div>

          <div class="hudPanel zoneBadge">
            <div class="label">Zona</div>
            <div id="zoneName" class="zoneName">Neon District</div>
          </div>

          <div class="hudPanel skillPanel">
            <div class="label">Skills</div>
            <div class="skillGrid">
              <button class="skillButton" data-skill="dash">Dash</button>
              <button class="skillButton" data-skill="shield">Shield</button>
              <button class="skillButton" data-skill="overdrive">
                Overdrive
              </button>
              <button class="skillButton" data-skill="heal">Heal</button>
            </div>
          </div>
        </div>
        <div id="notification" class="notif">Zona: Neon District</div>
      </div>

      <div id="mobileControls" class="mobileControls">
        <div id="joystick" class="joystickArea">
          <div id="stick" class="stick"></div>
        </div>
        <div id="shootBtn" class="shootBtn">FIRE</div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const menu = document.getElementById("menu");
      const hud = document.getElementById("hud");
      const startBtn = document.getElementById("startBtn");
      const exitBtn = document.getElementById("exitBtn");
      const characterGrid = document.getElementById("characterGrid");
      const weaponGrid = document.getElementById("weaponGrid");
      const notification = document.getElementById("notification");
      const healthFill = document.getElementById("healthFill");
      const hpText = document.getElementById("hpText");
      const scoreText = document.getElementById("scoreText");
      const zoneName = document.getElementById("zoneName");
      const waveText = document.getElementById("waveText");
      const ammoText = document.getElementById("ammoText");
      const hudExitBtn = document.getElementById("hudExitBtn");
      const joystick = document.getElementById("joystick");
      const stick = document.getElementById("stick");
      const shootBtn = document.getElementById("shootBtn");
      const skillButtons = Array.from(
        document.querySelectorAll(".skillButton"),
      );

      const WORLD = { w: 2600, h: 1800 };

      const characters = [
        {
          name: "Rei",
          speed: 5.2,
          maxHealth: 110,
          color: "#7ee7ff",
          accent: "#8ae9ff",
          bonus: "Tez harakat",
          description: "Kuchli yurish va tez zarbalar.",
        },
        {
          name: "Kairo",
          speed: 4.2,
          maxHealth: 140,
          color: "#ffc777",
          accent: "#ffd88a",
          bonus: "Qattiq himoya",
          description: "Uzoq omon qolish va katta himoya.",
        },
        {
          name: "Sora",
          speed: 5.6,
          maxHealth: 100,
          color: "#a7ffb8",
          accent: "#c8ffcf",
          bonus: "Nisbatan chaqqon",
          description: "Tez natija va silliq harakat.",
        },
        {
          name: "Aiko",
          speed: 4.8,
          maxHealth: 120,
          color: "#d89bff",
          accent: "#efc8ff",
          bonus: "Yengil qurol",
          description: "Aniq nishon va tez o'q otish.",
        },
      ];

      const weapons = [
        {
          name: "Pistol",
          damage: 16,
          fireRate: 0.22,
          speed: 800,
          color: "#ffd866",
          spread: 0.08,
          pellets: 1,
          clip: 12,
        },
        {
          name: "SMG",
          damage: 10,
          fireRate: 0.12,
          speed: 760,
          color: "#7ef3ff",
          spread: 0.16,
          pellets: 1,
          clip: 30,
        },
        {
          name: "Rifle",
          damage: 23,
          fireRate: 0.24,
          speed: 880,
          color: "#9ef2a5",
          spread: 0.05,
          pellets: 1,
          clip: 8,
        },
        {
          name: "Shotgun",
          damage: 12,
          fireRate: 0.58,
          speed: 720,
          color: "#ff8aa4",
          spread: 0.27,
          pellets: 6,
          clip: 6,
        },
        {
          name: "Plasma",
          damage: 31,
          fireRate: 0.34,
          speed: 980,
          color: "#b99cff",
          spread: 0.06,
          pellets: 1,
          clip: 5,
        },
      ];

      const zones = [
        {
          name: "Neon District",
          x: 0,
          y: 0,
          w: 1300,
          h: 900,
          bgTop: "#141d38",
          bgBottom: "#08172d",
          accent: "#5bd3ff",
        },
        {
          name: "Desert Ruins",
          x: 1300,
          y: 0,
          w: 1300,
          h: 900,
          bgTop: "#58401a",
          bgBottom: "#221711",
          accent: "#ffb461",
        },
        {
          name: "Lava Bastion",
          x: 0,
          y: 900,
          w: 1300,
          h: 900,
          bgTop: "#3a1013",
          bgBottom: "#120b16",
          accent: "#ff697d",
        },
        {
          name: "Frost Base",
          x: 1300,
          y: 900,
          w: 1300,
          h: 900,
          bgTop: "#142338",
          bgBottom: "#0d1a2a",
          accent: "#8dd9ff",
        },
      ];

      let selectedCharacter = 0;
      let selectedWeapon = 0;
      let state = "menu";
      let player = null;
      let enemies = [];
      let bullets = [];
      let particles = [];
      let pickups = [];
      let wave = 1;
      let gameTime = 0;
      let score = 0;
      let winText = "";
      let notifTimeout = 0;
      let skillCooldowns = { dash: 0, shield: 0, overdrive: 0, heal: 0 };
      let activeEffects = { overdrive: 0, shield: 0 };
      let audioCtx = null;

      const keys = {};
      let pointer = { x: 0, y: 0, down: false, touch: false };
      let moveStick = { active: false, dx: 0, dy: 0, cx: 0, cy: 0 };
      let mobileShoot = false;
      let camera = { x: 0, y: 0 };

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
        }
      }

      function playTone(
        freq = 440,
        duration = 0.08,
        type = "sine",
        volume = 0.04,
      ) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = type;
        oscillator.frequency.value = freq;
        gainNode.gain.value = volume;
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
        gainNode.gain.exponentialRampToValueAtTime(
          0.0001,
          audioCtx.currentTime + duration,
        );
      }

      function showNotification(text, ms = 1200) {
        notification.textContent = text;
        notification.classList.add("show");
        notifTimeout = ms;
      }

      function buildCharacterOptions() {
        characterGrid.innerHTML = characters
          .map(
            (char, index) => `
          <div class="optionCard ${index === selectedCharacter ? "active" : ""}" data-char="${index}">
            <h3>${char.name}</h3>
            <p>${char.description}</p>
            <div class="statRow"><span>HP</span><span>${char.maxHealth}</span></div>
            <div class="statRow"><span>Speed</span><span>${char.speed.toFixed(1)}</span></div>
          </div>
        `,
          )
          .join("");

        characterGrid.querySelectorAll(".optionCard").forEach((card) => {
          card.addEventListener("click", () => {
            selectedCharacter = Number(card.dataset.char);
            buildCharacterOptions();
          });
        });
      }

      function buildWeaponOptions() {
        weaponGrid.innerHTML = weapons
          .map(
            (weapon, index) => `
          <div class="optionCard ${index === selectedWeapon ? "active" : ""}" data-weapon="${index}">
            <h3>${weapon.name}</h3>
            <p>DMG ${weapon.damage} • rate ${weapon.fireRate.toFixed(2)}s</p>
            <div class="statRow"><span>Speed</span><span>${weapon.speed}</span></div>
            <div class="statRow"><span>Type</span><span>${weapon.pellets > 1 ? "Spread" : "Burst"}</span></div>
          </div>
        `,
          )
          .join("");

        weaponGrid.querySelectorAll(".optionCard").forEach((card) => {
          card.addEventListener("click", () => {
            selectedWeapon = Number(card.dataset.weapon);
            buildWeaponOptions();
          });
        });
      }

      function initializeMenu() {
        buildCharacterOptions();
        buildWeaponOptions();
      }

      function getCurrentZone(x, y) {
        for (const zone of zones) {
          if (
            x >= zone.x &&
            x <= zone.x + zone.w &&
            y >= zone.y &&
            y <= zone.y + zone.h
          )
            return zone;
        }
        return zones[0];
      }

      function createPlayer() {
        const char = characters[selectedCharacter];
        const weapon = weapons[selectedWeapon];
        return {
          x: WORLD.w / 2,
          y: WORLD.h / 2,
          radius: 20,
          speed: char.speed,
          maxHealth: char.maxHealth,
          health: char.maxHealth,
          angle: 0,
          weaponIndex: selectedWeapon,
          weapon: weapon,
          color: char.color,
          accent: char.accent,
          name: char.name,
          fireCooldown: 0,
          hitFlash: 0,
          scoreBonus: 0,
          ammo: Infinity,
          maxAmmo: Infinity,
        };
      }

      function createEnemy(zone) {
        const typeRoll = Math.random();
        const edge = Math.floor(Math.random() * 4);
        const margin = 70;
        let x = 0;
        let y = 0;

        if (edge === 0) {
          x = rand(zone.x + margin, zone.x + zone.w - margin);
          y = zone.y - 30;
        }
        if (edge === 1) {
          x = zone.x + zone.w + 30;
          y = rand(zone.y + margin, zone.y + zone.h - margin);
        }
        if (edge === 2) {
          x = rand(zone.x + margin, zone.x + zone.w - margin);
          y = zone.y + zone.h + 30;
        }
        if (edge === 3) {
          x = zone.x - 30;
          y = rand(zone.y + margin, zone.y + zone.h - margin);
        }

        let enemyType = "scout";
        let health = 36;
        let speed = 1.7 + Math.random() * 0.9;
        let radius = 18;
        let damage = 10;
        let fireRate = 1.6 + Math.random() * 0.7;

        if (typeRoll > 0.7) {
          enemyType = "rusher";
          health = 58;
          speed = 2.4 + Math.random() * 1.1;
          radius = 22;
          damage = 13;
        } else if (typeRoll > 0.4) {
          enemyType = "gunner";
          health = 48;
          speed = 1.4 + Math.random() * 0.5;
          radius = 20;
          damage = 10;
          fireRate = 1.2 + Math.random() * 0.5;
        }

        return {
          x,
          y,
          radius,
          speed,
          health,
          maxHealth: health,
          type: enemyType,
          damage,
          fireRate,
          cooldown: rand(0.4, 1.6),
          color:
            enemyType === "rusher"
              ? "#ff7b7b"
              : enemyType === "gunner"
                ? "#ffd35a"
                : "#7ee2ff",
          tint: enemyType === "rusher" ? "#ff6c82" : "#ffdb7d",
          angle: 0,
        };
      }

      function createBoss(zone) {
        return {
          x: zone.x + zone.w * 0.5,
          y: zone.y + zone.h * 0.5,
          radius: 34,
          speed: 1.3,
          health: 260 + wave * 35,
          maxHealth: 260 + wave * 35,
          type: "boss",
          damage: 18 + wave * 2,
          fireRate: 1.1,
          cooldown: 0.8,
          color: "#ff6b81",
          tint: "#ffd166",
          angle: 0,
        };
      }

      function spawnWave() {
        const zone = getCurrentZone(player.x, player.y);
        const desired = 5 + Math.floor(score / 80) + Math.floor(gameTime / 18);
        enemies = [];
        for (let i = 0; i < Math.min(desired, 14); i++) {
          enemies.push(createEnemy(zone));
        }
        if (wave % 3 === 0) {
          enemies.push(createBoss(zone));
          showNotification(`BOSS ALERT: ${zone.name}`);
        } else {
          showNotification(`Zona: ${zone.name}`);
        }
        if (Math.random() < 0.9) {
          spawnPickup(
            zone.x + rand(100, zone.w - 100),
            zone.y + rand(100, zone.h - 100),
          );
        }
      }

      function resetGame() {
        player = createPlayer();
        enemies = [];
        bullets = [];
        particles = [];
        pickups = [];
        wave = 1;
        score = 0;
        gameTime = 0;
        winText = "";
        spawnWave();
        updateHud();
      }

      function updateHud() {
        healthFill.style.width = `${(player.health / player.maxHealth) * 100}%`;
        hpText.textContent = `${Math.max(0, Math.ceil(player.health))} / ${player.maxHealth}`;
        scoreText.textContent = String(score);
        waveText.textContent = `Wave ${wave}`;
        ammoText.textContent =
          player.ammo === Infinity
            ? "Ammo ∞"
            : `Ammo ${Math.ceil(player.ammo)}`;
        const zone = getCurrentZone(player.x, player.y);
        zoneName.textContent = zone.name;
      }

      function fireBullet(
        owner,
        x,
        y,
        angle,
        speed,
        damage,
        color,
        spread = 0,
        fromEnemy = false,
      ) {
        const a = angle + rand(-spread, spread);
        bullets.push({
          x,
          y,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          radius: fromEnemy ? 5 : 5,
          damage,
          color,
          owner,
          life: 1.5,
          trail: [],
        });
      }

      function shootPlayerWeapon() {
        if (!player || player.fireCooldown > 0) return;
        if (player.ammo !== Infinity && player.ammo <= 0) {
          showNotification("Ammo empty");
          playTone(180, 0.08, "square", 0.02);
          return;
        }
        const weapon = weapons[player.weaponIndex];
        const baseAngle = player.angle;
        const totalShots = weapon.pellets;
        const overdriveBoost = activeEffects.overdrive > 0 ? 1.65 : 1;

        for (let i = 0; i < totalShots; i++) {
          fireBullet(
            "player",
            player.x + Math.cos(baseAngle) * 20,
            player.y + Math.sin(baseAngle) * 20,
            baseAngle,
            weapon.speed * overdriveBoost,
            weapon.damage * overdriveBoost,
            weapon.color,
            weapon.spread,
            false,
          );
        }

        if (player.ammo !== Infinity) player.ammo -= 1;
        player.fireCooldown =
          weapon.fireRate * (activeEffects.overdrive > 0 ? 0.55 : 1);
        playTone(520 + Math.random() * 80, 0.05, "square", 0.03);
        for (let i = 0; i < 6; i++) {
          particles.push({
            x: player.x + Math.cos(baseAngle) * 20,
            y: player.y + Math.sin(baseAngle) * 20,
            vx: rand(-40, 40),
            vy: rand(-40, 40),
            life: 0.2 + Math.random() * 0.2,
            color: weapon.color,
            radius: 2 + Math.random() * 2,
          });
        }
      }

      function handlePlayerInput(dt) {
        const char = characters[selectedCharacter];
        let moveX = 0;
        let moveY = 0;

        if (keys["ArrowUp"] || keys["w"]) moveY -= 1;
        if (keys["ArrowDown"] || keys["s"]) moveY += 1;
        if (keys["ArrowLeft"] || keys["a"]) moveX -= 1;
        if (keys["ArrowRight"] || keys["d"]) moveX += 1;

        if (moveStick.active) {
          moveX += moveStick.dx;
          moveY += moveStick.dy;
        }

        if (moveX !== 0 || moveY !== 0) {
          const len = Math.hypot(moveX, moveY) || 1;
          moveX /= len;
          moveY /= len;
        }

        player.x += moveX * char.speed * 60 * dt;
        player.y += moveY * char.speed * 60 * dt;
        player.x = clamp(player.x, 25, WORLD.w - 25);
        player.y = clamp(player.y, 25, WORLD.h - 25);

        let aimX = pointer.x;
        let aimY = pointer.y;
        if (!pointer.touch && !pointer.down) {
          aimX = canvas.width / 2 + 120;
          aimY = canvas.height / 2;
        }

        const worldPointerX = aimX + camera.x;
        const worldPointerY = aimY + camera.y;
        player.angle = Math.atan2(
          worldPointerY - player.y,
          worldPointerX - player.x,
        );

        if (keys[" "] || mobileShoot || pointer.down) {
          shootPlayerWeapon();
        }

        player.fireCooldown = Math.max(0, player.fireCooldown - dt);
      }

      function updateEnemyAI(dt) {
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.cooldown -= dt;
          const dx = player.x - e.x;
          const dy = player.y - e.y;
          const dist = Math.hypot(dx, dy) || 1;
          e.angle = Math.atan2(dy, dx);

          if (dist > 0.01) {
            const nx = dx / dist;
            const ny = dy / dist;
            e.x += nx * e.speed * 60 * dt;
            e.y += ny * e.speed * 60 * dt;
          }

          if (dist < 450 && e.cooldown <= 0) {
            const angle = Math.atan2(dy, dx);
            fireBullet(
              "enemy",
              e.x,
              e.y,
              angle,
              420,
              e.damage,
              "#ff7a7a",
              0.08,
              true,
            );
            e.cooldown = e.fireRate;
          }
        }
      }

      function updateBullets(dt) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.life -= dt;

          if (
            b.x < 0 ||
            b.x > WORLD.w ||
            b.y < 0 ||
            b.y > WORLD.h ||
            b.life <= 0
          ) {
            bullets.splice(i, 1);
            continue;
          }

          if (b.owner === "player") {
            for (let j = enemies.length - 1; j >= 0; j--) {
              const e = enemies[j];
              if (distance(b, e) < e.radius + 4) {
                e.health -= b.damage;
                bullets.splice(i, 1);
                if (e.health <= 0) {
                  score += 20;
                  destroyEnemy(j);
                }
                break;
              }
            }
          } else {
            if (distance(b, player) < player.radius + 4) {
              player.health -= b.damage;
              player.hitFlash = 0.2;
              bullets.splice(i, 1);
              if (player.health <= 0) {
                endGame();
              }
            }
          }
        }
      }

      function spawnPickup(x, y) {
        const types = ["med", "ammo", "power"];
        const type = types[Math.floor(Math.random() * types.length)];
        pickups.push({ x, y, r: 9, type, pulse: Math.random() * Math.PI * 2 });
      }

      function updatePickups() {
        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.pulse += 0.08;
          if (distance(p, player) < 26) {
            if (p.type === "med") {
              player.health = Math.min(player.maxHealth, player.health + 28);
              showNotification("Medkit +25");
            } else if (p.type === "ammo") {
              player.ammo = Infinity;
              showNotification("Ammo refill");
            } else {
              player.weaponIndex = Math.min(
                weapons.length - 1,
                player.weaponIndex + 1,
              );
              showNotification(
                `Weapon upgrade: ${weapons[player.weaponIndex].name}`,
              );
            }
            pickups.splice(i, 1);
            updateHud();
          }
        }
      }

      function destroyEnemy(index) {
        const e = enemies[index];
        for (let n = 0; n < 16; n++) {
          particles.push({
            x: e.x,
            y: e.y,
            vx: rand(-140, 140),
            vy: rand(-140, 140),
            life: 0.5 + Math.random() * 0.5,
            color: e.color,
            radius: 2 + Math.random() * 3,
          });
        }
        if (Math.random() < 0.22) {
          spawnPickup(e.x, e.y);
        }
        enemies.splice(index, 1);
        if (enemies.length === 0) {
          score += 60;
          const zone = getCurrentZone(player.x, player.y);
          wave += 1;
          setTimeout(() => {
            if (state !== "playing") return;
            const newZoneIndex =
              (zones.findIndex((z) => z.name === zone.name) + 1) % zones.length;
            const nextZone = zones[newZoneIndex];
            player.x = nextZone.x + nextZone.w * 0.5;
            player.y = nextZone.y + nextZone.h * 0.4;
            switchZone(nextZone.name, true);
          }, 250);
        }
      }

      function switchZone(name, forceWave = false) {
        const zone = getCurrentZone(player.x, player.y);
        const displayName = zone ? zone.name : name;
        showNotification(`Zona: ${displayName}`);
        if (forceWave || enemies.length === 0) {
          spawnWave();
        }
        updateHud();
      }

      function exitToMenu() {
        state = "menu";
        hud.style.display = "none";
        menu.style.display = "flex";
        if (player) {
          player = null;
        }
        menu.querySelector(".panel").innerHTML = `
          <h1 class="title">Manga Strike</h1>
          <p class="subtitle">Kiber-sinfdan qutulish uchun botlarni yo'q qiling. Turli zonalar, qahramonlar va qurollar bilan jang qiling.</p>
          <div class="sectionLabel">Qahramon tanlang</div>
          <div id="characterGrid" class="cardGrid"></div>
          <div class="sectionLabel">Qurol tanlang</div>
          <div id="weaponGrid" class="cardGrid"></div>
          <div class="menuActions">
            <button id="startBtn">Jangga kirish</button>
            <button id="exitBtn" type="button">Chiqish</button>
          </div>
        `;
        buildCharacterOptions();
        buildWeaponOptions();
        document
          .getElementById("startBtn")
          .addEventListener("click", startGame);
        document
          .getElementById("exitBtn")
          .addEventListener("click", exitToMenu);
      }

      function endGame(victory = false) {
        state = "gameover";
        menu.style.display = "flex";
        const content = menu.querySelector(".panel");
        content.innerHTML = `
          <h1 class="title" style="color:${victory ? "#8ef2ab" : "#ff9ab1"};">${victory ? "G'olib bo'ldingiz!" : "Jang tugadi"}</h1>
          <p class="subtitle">Sizning ball: <strong>${score}</strong></p>
          <p class="subtitle">${victory ? "Sinfdan xalos bo'ldingiz. Yana yangi jangga tayyorlaning." : "Yana urinish qilib ko'ring yoki turli qurol va qahramonlarni tanlang."}</p>
          <div class="menuActions">
            <button id="restartBtn" class="secondaryBtn" style="background:linear-gradient(135deg, ${victory ? "#8ef2ab" : "#ffc777"}, ${victory ? "#5bd3ff" : "#ff8aa4"});color:#031018;">Qayta boshlash</button>
            <button id="exitBtn" class="secondaryBtn" type="button">Chiqish</button>
          </div>
        `;
        playTone(
          victory ? 880 : 220,
          victory ? 0.2 : 0.15,
          victory ? "triangle" : "sawtooth",
          victory ? 0.05 : 0.04,
        );
        document.getElementById("restartBtn").addEventListener("click", () => {
          exitToMenu();
          startGame();
        });
        document
          .getElementById("exitBtn")
          .addEventListener("click", exitToMenu);
      }

      function startGame() {
        initAudio();
        menu.style.display = "none";
        hud.style.display = "block";
        state = "playing";
        skillCooldowns = { dash: 0, shield: 0, overdrive: 0, heal: 0 };
        activeEffects = { overdrive: 0, shield: 0 };
        score = 0;
        wave = 1;
        resetGame();
        updateHud();
        skillButtons.forEach((btn) => {
          btn.disabled = false;
        });
        playTone(440, 0.08, "triangle", 0.05);
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      function updateCamera() {
        camera.x = clamp(
          player.x - canvas.width / 2,
          0,
          WORLD.w - canvas.width,
        );
        camera.y = clamp(
          player.y - canvas.height / 2,
          0,
          WORLD.h - canvas.height,
        );
      }

      function useSkill(name) {
        if (!player || state !== "playing") return;
        const cooldown = skillCooldowns[name] || 0;
        if (cooldown > 0) return;

        if (name === "dash") {
          const aim = { x: Math.cos(player.angle), y: Math.sin(player.angle) };
          player.x = clamp(player.x + aim.x * 80, 25, WORLD.w - 25);
          player.y = clamp(player.y + aim.y * 80, 25, WORLD.h - 25);
          skillCooldowns.dash = 5;
          showNotification("Dash!");
          playTone(660, 0.1, "triangle", 0.04);
        }

        if (name === "shield") {
          activeEffects.shield = 5;
          player.health = Math.min(player.maxHealth, player.health + 20);
          skillCooldowns.shield = 8;
          showNotification("Shield up");
          playTone(320, 0.14, "sine", 0.06);
        }

        if (name === "overdrive") {
          activeEffects.overdrive = 5;
          skillCooldowns.overdrive = 9;
          showNotification("Overdrive");
          playTone(820, 0.12, "sawtooth", 0.05);
        }

        if (name === "heal") {
          player.health = Math.min(player.maxHealth, player.health + 35);
          skillCooldowns.heal = 12;
          showNotification("Heal +35");
          playTone(500, 0.16, "triangle", 0.05);
        }

        const btn = document.querySelector(`[data-skill="${name}"]`);
        if (btn) {
          btn.disabled = true;
          setTimeout(
            () => {
              if (state === "playing") btn.disabled = false;
            },
            (skillCooldowns[name] || 1) * 1000,
          );
        }
      }

      function update(dt) {
        if (state !== "playing") return;
        gameTime += dt;
        for (const key of Object.keys(skillCooldowns)) {
          skillCooldowns[key] = Math.max(0, (skillCooldowns[key] || 0) - dt);
        }
        for (const key of Object.keys(activeEffects)) {
          activeEffects[key] = Math.max(0, (activeEffects[key] || 0) - dt);
        }

        handlePlayerInput(dt);
        updateEnemyAI(dt);
        updateBullets(dt);
        updatePickups();
        updateParticles(dt);
        updateCamera();
        const zone = getCurrentZone(player.x, player.y);
        zoneName.textContent = zone.name;
        if (player.hitFlash > 0) player.hitFlash -= dt;
        updateHud();

        if (score > 0 && score % 200 === 0 && enemies.length < 9) {
          spawnWave();
        }

        if (score >= 1500 || wave >= 8) {
          endGame(true);
        }
      }

      function drawGrid() {
        const zone = getCurrentZone(player.x, player.y);
        const x0 = camera.x;
        const y0 = camera.y;
        ctx.fillStyle = zone.bgTop;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const rect of zones) {
          const sx = rect.x - x0;
          const sy = rect.y - y0;
          const w = rect.w;
          const h = rect.h;
          ctx.fillStyle = "rgba(255,255,255,0.02)";
          ctx.fillRect(sx, sy, w, h);
          ctx.strokeStyle = rect.accent + "55";
          ctx.lineWidth = 2;
          ctx.strokeRect(sx, sy, w, h);
          for (let gx = rect.x; gx <= rect.x + rect.w; gx += 80) {
            const px = gx - x0;
            ctx.beginPath();
            ctx.moveTo(px, sy);
            ctx.lineTo(px, sy + h);
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.stroke();
          }
          for (let gy = rect.y; gy <= rect.y + rect.h; gy += 80) {
            const py = gy - y0;
            ctx.beginPath();
            ctx.moveTo(sx, py);
            ctx.lineTo(sx + w, py);
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.stroke();
          }
        }
      }

      function drawWeapon(actor, isPlayer = false) {
        const weaponColor = isPlayer ? "#dfefff" : "#222a35";
        const barrelLen = isPlayer ? 28 : 24;
        const thickness = isPlayer ? 5 : 4;

        ctx.save();
        ctx.translate(18, 0);
        ctx.rotate(0.1);
        ctx.fillStyle = weaponColor;
        ctx.fillRect(0, -thickness / 2, barrelLen, thickness);
        ctx.fillStyle = "#0b1320";
        ctx.fillRect(-8, -6, 12, 12);
        ctx.restore();
      }

      function drawCharacter(actor, isPlayer = false) {
        const bodyColor = actor.color || "#7ee7ff";
        const accent = actor.accent || "#ffffff";
        const healthRatio = actor.health / actor.maxHealth;

        ctx.save();
        ctx.translate(actor.x - camera.x, actor.y - camera.y);
        ctx.rotate(actor.angle || 0);

        ctx.fillStyle = "rgba(0,0,0,0.22)";
        ctx.beginPath();
        ctx.ellipse(0, 26, 18, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#0b1320";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(-7, 17);
        ctx.lineTo(-10, 30);
        ctx.moveTo(7, 17);
        ctx.lineTo(10, 30);
        ctx.stroke();

        ctx.fillStyle = bodyColor;
        ctx.fillRect(-12, -8, 24, 26);

        ctx.fillStyle = accent;
        ctx.fillRect(-8, -3, 16, 12);

        ctx.fillStyle = "#f8d9b7";
        ctx.beginPath();
        ctx.arc(0, -18, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = accent;
        ctx.fillRect(-12, -24, 24, 8);

        ctx.strokeStyle = "#f8d9b7";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-12, 0);
        ctx.lineTo(-22, 6);
        ctx.moveTo(12, 0);
        ctx.lineTo(22, 6);
        ctx.stroke();

        drawWeapon(actor, isPlayer);

        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(-18, -34, 36, 5);
        ctx.fillStyle = "#7ef2ab";
        ctx.fillRect(-18, -34, 36 * healthRatio, 5);

        ctx.restore();
      }

      function drawPickups() {
        for (const p of pickups) {
          const px = p.x - camera.x;
          const py = p.y - camera.y;
          const color =
            p.type === "med"
              ? "#7ef2ab"
              : p.type === "ammo"
                ? "#ffd166"
                : "#b99cff";
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(px, py + Math.sin(p.pulse) * 3, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#061019";
          ctx.font = "10px Arial";
          ctx.textAlign = "center";
          ctx.fillText(
            p.type === "med" ? "+" : p.type === "ammo" ? "A" : "W",
            px,
            py + 3,
          );
        }
      }

      function drawWorld() {
        const x0 = camera.x;
        const y0 = camera.y;

        for (const enemy of enemies) {
          drawCharacter(
            {
              x: enemy.x,
              y: enemy.y,
              angle: enemy.angle,
              color: enemy.color,
              accent: enemy.tint,
              health: enemy.health,
              maxHealth: enemy.maxHealth,
            },
            false,
          );
        }

        drawPickups();

        for (const b of bullets) {
          const px = b.x - x0;
          const py = b.y - y0;
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const p of particles) {
          const px = p.x - x0;
          const py = p.y - y0;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(px, py, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        drawCharacter(
          {
            x: player.x,
            y: player.y,
            angle: player.angle,
            color: player.color,
            accent: player.accent,
            health: player.health,
            maxHealth: player.maxHealth,
          },
          true,
        );
      }

      function drawAimMarker() {
        const tx = pointer.x;
        const ty = pointer.y;
        ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(tx, ty, 16, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(tx - 18, ty);
        ctx.lineTo(tx + 18, ty);
        ctx.moveTo(tx, ty - 18);
        ctx.lineTo(tx, ty + 18);
        ctx.stroke();
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!player) {
          ctx.fillStyle = "#09111f";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          return;
        }
        drawGrid();
        drawWorld();
        if (state === "playing") {
          drawAimMarker();
        }
      }

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        pointer.x = window.innerWidth / 2;
        pointer.y = window.innerHeight / 2;
      }

      function animate(ts) {
        const dt = Math.min((ts - (animate.last || ts)) / 1000, 0.033);
        animate.last = ts;
        update(dt);
        render();
        requestAnimationFrame(animate);
      }

      function updatePointerFromMouse(event) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = event.clientX - rect.left;
        pointer.y = event.clientY - rect.top;
        pointer.down = true;
        pointer.touch = false;
      }

      function updatePointerFromTouch(event) {
        const rect = canvas.getBoundingClientRect();
        const touch = event.touches[0] || event.changedTouches[0];
        if (!touch) return;
        pointer.x = touch.clientX - rect.left;
        pointer.y = touch.clientY - rect.top;
        pointer.touch = true;
        pointer.down =
          event.type === "touchstart" || event.type === "touchmove";
      }

      function handleKeyChange(event, isDown) {
        keys[event.key] = isDown;
        if (event.key === " ") {
          keys[" "] = isDown;
        }
        if (event.key === "1") selectedWeapon = 0;
        if (event.key === "2") selectedWeapon = 1;
        if (event.key === "3") selectedWeapon = 2;
        if (event.key === "4") selectedWeapon = 3;
        if (event.key === "5") selectedWeapon = 4;
        if (player && state === "playing") {
          player.weaponIndex = selectedWeapon;
          player.weapon = weapons[selectedWeapon];
        }
      }

      function setupControls() {
        document.addEventListener("keydown", (event) => {
          handleKeyChange(event, true);
          if (event.key.toLowerCase() === "q") useSkill("dash");
          if (event.key.toLowerCase() === "e") useSkill("shield");
          if (event.key.toLowerCase() === "r") useSkill("overdrive");
          if (event.key.toLowerCase() === "f") useSkill("heal");
        });
        document.addEventListener("keyup", (event) =>
          handleKeyChange(event, false),
        );

        canvas.addEventListener("pointerdown", (event) => {
          updatePointerFromMouse(event);
          pointer.down = true;
        });
        canvas.addEventListener("pointermove", (event) => {
          updatePointerFromMouse(event);
        });
        canvas.addEventListener("pointerup", () => {
          pointer.down = false;
        });
        canvas.addEventListener("pointerleave", () => {
          pointer.down = false;
        });

        canvas.addEventListener("touchstart", updatePointerFromTouch, {
          passive: true,
        });
        canvas.addEventListener("touchmove", updatePointerFromTouch, {
          passive: true,
        });
        canvas.addEventListener("touchend", () => {
          pointer.down = false;
        });

        joystick.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          moveStick.active = true;
          const rect = joystick.getBoundingClientRect();
          const x = event.clientX - rect.left - rect.width / 2;
          const y = event.clientY - rect.top - rect.height / 2;
          const len = Math.hypot(x, y);
          const limit = 38;
          moveStick.dx = len > limit ? (x / len) * 1 : x / 38;
          moveStick.dy = len > limit ? (y / len) * 1 : y / 38;
          stick.style.transform = `translate(${x}px, ${y}px)`;
        });

        joystick.addEventListener("pointermove", (event) => {
          if (!moveStick.active) return;
          const rect = joystick.getBoundingClientRect();
          const x = event.clientX - rect.left - rect.width / 2;
          const y = event.clientY - rect.top - rect.height / 2;
          const len = Math.hypot(x, y);
          const max = 38;
          if (len > max) {
            const scale = max / len;
            moveStick.dx = (x * scale) / max;
            moveStick.dy = (y * scale) / max;
            stick.style.transform = `translate(${x * scale}px, ${y * scale}px)`;
          } else {
            moveStick.dx = x / max;
            moveStick.dy = y / max;
            stick.style.transform = `translate(${x}px, ${y}px)`;
          }
        });

        ["pointerup", "pointercancel", "pointerleave"].forEach((type) => {
          joystick.addEventListener(type, () => {
            moveStick.active = false;
            moveStick.dx = 0;
            moveStick.dy = 0;
            stick.style.transform = "translate(-50%, -50%)";
          });
        });

        shootBtn.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          mobileShoot = true;
        });
        shootBtn.addEventListener("pointerup", () => {
          mobileShoot = false;
        });
        shootBtn.addEventListener("pointerleave", () => {
          mobileShoot = false;
        });
        shootBtn.addEventListener("pointercancel", () => {
          mobileShoot = false;
        });

        skillButtons.forEach((btn) => {
          btn.addEventListener("click", () => {
            const skill = btn.dataset.skill;
            useSkill(skill);
          });
        });
      }

      startBtn.addEventListener("click", startGame);
      exitBtn.addEventListener("click", exitToMenu);
      hudExitBtn.addEventListener("click", exitToMenu);
      initializeMenu();
      resizeCanvas();
      setupControls();
      requestAnimationFrame(animate);
      window.addEventListener("resize", resizeCanvas);
      pointer.x = canvas.width / 2;
      pointer.y = canvas.height / 2;
    </script>
  </body>
</html>
